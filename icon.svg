<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0D18"/>
      <stop offset="50%" stop-color="#08070B"/>
      <stop offset="100%" stop-color="#050407"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B"/>
      <stop offset="50%" stop-color="#D91E2A"/>
      <stop offset="100%" stop-color="#8B000E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF089"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Fondo redondeado -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#D91E2A" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Círculo central con resplandor -->
  <circle cx="256" cy="256" r="160" fill="#120A14" stroke="#D91E2A" stroke-width="6" stroke-opacity="0.6" filter="url(#glow)"/>
  
  <!-- Triángulo Play Carlicos -->
  <polygon points="216,168 356,256 216,344" fill="url(#redGrad)"/>
  
  <!-- Corona / Puntos dorados de portal -->
  <circle cx="256" cy="116" r="14" fill="url(#goldGrad)"/>
  <circle cx="376" cy="256" r="14" fill="url(#goldGrad)"/>
  <circle cx="256" cy="396" r="14" fill="url(#goldGrad)"/>
  <circle cx="136" cy="256" r="14" fill="url(#goldGrad)"/>
</svg>
